<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="flame" x1="0%" y1="100%" x2="30%" y2="0%">
      <stop offset="0%" style="stop-color:#C4572A;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#E8732A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFB347;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#E8732A;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#E8732A;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#1C1917"/>
  <!-- Glow behind B -->
  <ellipse cx="16" cy="19" rx="11" ry="10" fill="url(#glow)"/>
  <!-- Flame tip above B -->
  <path d="M19 4 C19 4 22 7 20 10 C21 8 23 9 22 12 C21 10 18 11 18 8 C17 10 16 12 17 14 C15 12 14 9 16 6 C14 8 13 11 15 13 C13 11 12 8 14 5 C12 8 12 12 14 14" stroke="none" fill="#FF9A3C" opacity="0.7"/>
  <!-- Bold B letter with flame gradient -->
  <text x="16" y="25"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="21"
    font-weight="900"
    text-anchor="middle"
    fill="url(#flame)">B</text>
  <!-- Tiny ember dots -->
  <circle cx="22" cy="5" r="1.2" fill="#FFB347" opacity="0.8"/>
  <circle cx="20" cy="3" r="0.8" fill="#FF8C42" opacity="0.6"/>
  <circle cx="24" cy="7" r="0.7" fill="#FFB347" opacity="0.5"/>
</svg>
