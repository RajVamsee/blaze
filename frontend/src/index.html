<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blaze — Where Ideas Catch Fire</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Preset A: Organic Tech — Typography Stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-cream text-charcoal antialiased">

  <!-- Global Noise Texture Overlay -->
  <svg class="pointer-events-none fixed inset-0 z-[9999] h-full w-full" aria-hidden="true">
    <filter id="blaze-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#blaze-noise)" opacity="0.05"/>
  </svg>

  <app-root></app-root>
</body>
</html>
