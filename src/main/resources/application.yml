spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:blaze}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  security:
    jwt:
      secret: ${JWT_SECRET:BlazeSecretKey2024SuperSecureRandomStringForJWTTokenGeneration}
      expiration: 86400000

server:
  port: ${PORT:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
